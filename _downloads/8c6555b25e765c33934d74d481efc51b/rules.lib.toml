# --- Task C: hold the texture UNINFORMATIVE by redrawing it every trial -----------------------
# Stripes or rings, drawn independently of the size->gain scenario, so the pattern predicts
# nothing. It is kept rather than dropped so the two tasks stay matched on what is on the screen:
# Task B needs two visually distinct pucks, and a Task C puck that was always plain would differ
# from a Task B puck in more than the binding.
#
# random_choice draws from {min, max}, i.e. exactly the two pattern ids named here (1 = stripes,
# 4 = rings). It fires on the same episode:1 cadence as the size map; the scheduler evaluates
# every rule independently and accumulates into one pending-KV dict, so two rules with DIFFERENT
# targets compose rather than one winning (rules_scheduler._maybe_apply).
[rules_lib.taskc_texture_random]
target        = "unity.kv.hockeyFloor.puck_cue_pattern"
op            = "random_choice"
every         = "episode:1"
min           = 1
max           = 4

# --- Task B: trial-unique texture <-> gain assignment ---
# Textures are visually distinct but NON-predictive: the assignment is redrawn every trial,
# so the animal must bind object to property afresh each time. That trial-unique binding is
# what makes this the interference-stressor counterpart to Task C's stable mapping.
# --- Task B: sequential sampling ---------------------------------------------------------
# Two pucks per trial, visually distinct but NON-predictive: the texture->gain binding and the
# texture->spawn-slot binding are both redrawn uniformly every trial, so neither the pattern nor
# the position carries information about which puck is pushable. The animal can only find out by
# probing.
#
# THE REWARDED PUCK IS THE LOW-GAIN ONE. This was reversed until 2026-09-02 and it is the one
# structural error in the profile, not a tuning slip. The criterion is a threshold the puck must
# be pushed PAST, and the distractor is inert: with the HIGH-gain puck rewarded, a single blind
# push hard enough for the low-gain puck also carries the high-gain one past the threshold, so
# one undifferentiated amplitude solves the trial and there is nothing to infer. Rewarding the
# LOW-gain puck inverts that -- an amplitude sufficient for the rewarded puck is only reached by
# committing to it, so the animal has to identify which puck it is holding before it commits.
#
# THE DISTRACTOR GAIN IS 6.0, NOT 3.0 (changed 2026-10-06). The design's target is an EFFECTIVE
# displacement ratio near 2 -- the argmax of the switch diagnostic (T25): wider makes the pucks
# trivially discriminable on one push, narrower makes the mistake budget vanish. 1.5 / 3.0 was
# chosen assuming push travel scales with gain. Stage-A data say it does not: ~70% of a push is
# CARRY (travel while still in contact, which the gain does not scale), so 1.5 / 3.0 delivers
# rho_eff ~1.3 -- below T25's range. With coast share s ~0.28-0.30, rho_eff ~ (1-s) + s*k_hi/k_lo,
# so 6.0 restores ~1.85 (a LOWER bound: some in-contact travel likely scales too). Measure it in
# Task B from first pushes (PushKinematicsAnalysis.rho_first_push) and step 6.0 down during
# acquisition while rho_first_push stays >= 1.75; freeze before data collection. Rewarded gain
# and drag are unchanged, so the rewarded puck is the one stage A trained on.
#
# All three per-puck lists are set by ONE scenario, so pattern, gain and role can never
# desynchronise within a trial. Values are comma-separated in spawn order, and role 0 = rewarded.
#
# THE FOUR CELLS ARE DRAWN I.I.D., NOT COUNTERBALANCED. scenario_choice picks one independently
# every trial, so the realised split is binomial rather than exact: over 40-trial sessions the
# rewarded-slot count ranges 9-30 against an expectation of 20, and about 16 per cent of sessions
# land at 25/15 or worse. That is accepted -- i.i.d. draws carry no sequential structure for the
# animal to exploit, which block-shuffling would introduce -- but it means a per-session
# imbalance is NOISE, not evidence the rule failed. SessionMonitor's alarm is set accordingly:
# it gates on texture_slot_balance_z against the i.i.d. null, not on the deviation being zero.
[rules_lib.taskb_puck_assignment]
op            = "scenario_choice"
every         = "episode:1"

# stripes in slot 0, and stripes is the REWARDED low-gain puck
[[rules_lib.taskb_puck_assignment.scenarios]]
label  = "stripes_low_slot0"
[[rules_lib.taskb_puck_assignment.scenarios.params]]
target = "unity.kv.hockeyFloor.puck_cue_patterns"
value  = "1,4"
[[rules_lib.taskb_puck_assignment.scenarios.params]]
target = "unity.kv.hockeyFloor.puck_gains"
value  = "1.5,6.0"
[[rules_lib.taskb_puck_assignment.scenarios.params]]
target = "unity.kv.hockeyFloor.puck_roles"
value  = "0,1"

# stripes in slot 0, and rings is the REWARDED low-gain puck
[[rules_lib.taskb_puck_assignment.scenarios]]
label  = "stripes_high_slot0"
[[rules_lib.taskb_puck_assignment.scenarios.params]]
target = "unity.kv.hockeyFloor.puck_cue_patterns"
value  = "1,4"
[[rules_lib.taskb_puck_assignment.scenarios.params]]
target = "unity.kv.hockeyFloor.puck_gains"
value  = "6.0,1.5"
[[rules_lib.taskb_puck_assignment.scenarios.params]]
target = "unity.kv.hockeyFloor.puck_roles"
value  = "1,0"

# rings in slot 0, and rings is the REWARDED low-gain puck
[[rules_lib.taskb_puck_assignment.scenarios]]
label  = "rings_low_slot0"
[[rules_lib.taskb_puck_assignment.scenarios.params]]
target = "unity.kv.hockeyFloor.puck_cue_patterns"
value  = "4,1"
[[rules_lib.taskb_puck_assignment.scenarios.params]]
target = "unity.kv.hockeyFloor.puck_gains"
value  = "1.5,6.0"
[[rules_lib.taskb_puck_assignment.scenarios.params]]
target = "unity.kv.hockeyFloor.puck_roles"
value  = "0,1"

# rings in slot 0, and stripes is the REWARDED low-gain puck
[[rules_lib.taskb_puck_assignment.scenarios]]
label  = "rings_high_slot0"
[[rules_lib.taskb_puck_assignment.scenarios.params]]
target = "unity.kv.hockeyFloor.puck_cue_patterns"
value  = "4,1"
[[rules_lib.taskb_puck_assignment.scenarios.params]]
target = "unity.kv.hockeyFloor.puck_gains"
value  = "6.0,1.5"
[[rules_lib.taskb_puck_assignment.scenarios.params]]
target = "unity.kv.hockeyFloor.puck_roles"
value  = "1,0"

# --- Task B: OPTIONAL per-trial jitter of the threshold ---------------------------------------
# DEFAULT: NOT ATTACHED. Introduce it after the task is acquired, never before -- what a variable
# criterion does to acquisition is the one thing the simulation could not model.
#
# WHAT IT BUYS. With a fixed threshold, an animal that pushes and gets nothing cannot tell "wrong
# puck" from "right puck, not far enough yet" -- but it does not need to, because it knows how
# far it pushed. Drawing theta_min afresh each trial removes that shortcut: absence of reward
# stops being diagnostic of distance, so identifying the puck becomes worth more. Measured, it is
# worth roughly x3 on the inference advantage (+0.9% -> +2.6% at a generous 15 s clock,
# +5.5% -> +17% at a tight 5 s one).
#
# WHY A DISCRETE LADDER IS ENOUGH. Five log-spaced levels score within Monte-Carlo noise of a
# continuous log-uniform draw (+15.9% vs +17.9% at J = 2, 5 s clock). The null strategy still has
# to push to the TOP of the range before it can abandon a puck, and that is what sets its cost.
#
# WHY BOUNDED. A log-normal at matched SD gives the same effect (+15.4% vs +17.1%), so the shape
# does not matter -- but it has no maximum, and an unreachable criterion is an unwinnable trial.
# log-uniform at J = 2 tops out at 1.41x the median; the ladder's top level, 5.01, is exactly the
# push-room floor at separation 100 / half-width 20 with a 3 x 2 u init zone.
#
# WHY THIS IS NOT ramp_band_min, WHICH THE COMMENT ABOVE FORBIDS HERE. That warning is about a
# RAMP: it moves the criterion monotonically with success count, so session time and criterion are
# confounded and the drift cannot be balanced away. A per-episode random draw is balanced by
# construction, orthogonal to time, and logged per trial, so it enters the analysis as a covariate
# rather than a confound. The warning's other clause -- "push scaling cannot be read against a
# fixed band" -- is a Task C objection: C's readouts are aim relative to the band, while Task B
# has no aiming demand at all because band_max sits at the arena limit. What DOES carry over is
# "trials are not comparable": trial length, push count and wasted effort all scale with the drawn
# threshold, so every one of them must be normalised by it in the analysis. The primary readout,
# the first-push switch asymmetry, needs no normalisation -- it is scored long before any
# criterion is approached.
#
# band_min is a SCALAR KV read by the spawner and applied to every puck, so all pucks share the
# drawn criterion automatically. A per-puck criterion would be a second cue, and the scalar form
# rules it out for free. band_max sits at the arena limit in Task B, so raising band_min can never
# collide with it.
[rules_lib.taskb_theta_jitter]
op    = "scenario_choice"
every = "episode:1"

[[rules_lib.taskb_theta_jitter.scenarios]]           # x0.707
label  = "theta_250"
weight = 0.2
[[rules_lib.taskb_theta_jitter.scenarios.params]]
target = "unity.kv.hockeyFloor.band_min"
value  = 2.50

[[rules_lib.taskb_theta_jitter.scenarios]]           # x0.841
label  = "theta_298"
weight = 0.2
[[rules_lib.taskb_theta_jitter.scenarios.params]]
target = "unity.kv.hockeyFloor.band_min"
value  = 2.98

[[rules_lib.taskb_theta_jitter.scenarios]]           # x1.000, the median
label  = "theta_354"
weight = 0.2
[[rules_lib.taskb_theta_jitter.scenarios.params]]
target = "unity.kv.hockeyFloor.band_min"
value  = 3.54

[[rules_lib.taskb_theta_jitter.scenarios]]           # x1.189
label  = "theta_421"
weight = 0.2
[[rules_lib.taskb_theta_jitter.scenarios.params]]
target = "unity.kv.hockeyFloor.band_min"
value  = 4.21

[[rules_lib.taskb_theta_jitter.scenarios]]           # x1.414, pinned to the push-room floor
label  = "theta_501"
weight = 0.2
[[rules_lib.taskb_theta_jitter.scenarios.params]]
target = "unity.kv.hockeyFloor.band_min"
value  = 5.01

##### Rules for Sequence Places ######
[rules_lib.reduce_platform_sizex]
target        = "unity.kv.gridSeq.target_scale_x"
op            = "subtract"         # set|add|mul|subtract
value         = 0.01
every         = "success:5"    # success:N | failure:N | episode:N | epoch:N
min           = 6
max           = 8

[rules_lib.reduce_platform_sizey]
target        = "unity.kv.gridSeq.target_scale_y"
op            = "subtract"         # set|add|mul|subtract
value         = 0.01
every         = "success:5"    # success:N | failure:N | episode:N | epoch:N
min           = 6
max           = 8

[rules_lib.ramp_dwelltime]
target        = "unity.kv.SequenceManager.dwell_target_seconds"
op            = "add"         # set|add|mul|subtract
value         = 0.01
every         = "success:1"    # success:N | failure:N | episode:N | epoch:N
min           = 0.1
max           = 1
