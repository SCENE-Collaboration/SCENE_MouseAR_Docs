### Rules for HockeyGame #####
[rules_lib.ramp_distance]
target        = "unity.kv.hockeyFloor.move_object_max_distance"
op            = "add"         # set|add|mul|substract
value         = 0.04
every         = "success:1"    # trial:N | success:N | episode:N | epoch:N
min           = 0.5
max           = 5.00

[rules_lib.ramp_distance_middlesteps]
target        = "unity.kv.hockeyFloor.move_object_max_distance"
op            = "add"         # set|add|mul|substract
value         = 0.1
every         = "success:1"    # trial:N | success:N | episode:N | epoch:N
min           = 3
max           = 15.00

[rules_lib.ramp_distance_largersteps]
target        = "unity.kv.hockeyFloor.move_object_max_distance"
op            = "add"         # set|add|mul|substract
value         = 0.2
every         = "success:1"    # trial:N | success:N | episode:N | epoch:N
min           = 5
max           = 25

[rules_lib.random_z_puck_position]
target        = "unity.kv.hockeyFloor.move_object_z"
op            = "rand"
every         = "success:1"    # trial:N | success:N | episode:N | epoch:N
min           = -7
max           = 7

[rules_lib.random_x_puck_position]
target        = "unity.kv.hockeyFloor.move_object_x"
op            = "rand"
every         = "success:1"    # trial:N | success:N | episode:N | epoch:N
min           = -5
max           = 5


[rules_lib.random_goal_zside]
target        = "unity.kv.hockeyFloor.target_z"
op            = "random_choice"
every         = "success:1"    # chooses either min or max
min           = -5
max           = 5

