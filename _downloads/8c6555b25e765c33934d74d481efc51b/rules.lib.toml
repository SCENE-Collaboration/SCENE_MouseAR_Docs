##### Rules for Sequence Places ######
[rules_lib.reduce_platform_sizex]
target        = "unity.kv.gridSeq.target_scale_x"
op            = "subtract"         # set|add|mul|subtract
value         = 0.01
every         = "success:5"    # trial:N | success:N | episode:N | epoch:N
min           = 6
max           = 8

[rules_lib.reduce_platform_sizey]
target        = "unity.kv.gridSeq.target_scale_y"
op            = "subtract"         # set|add|mul|subtract
value         = 0.01
every         = "success:5"    # trial:N | success:N | episode:N | epoch:N
min           = 6
max           = 8

[rules_lib.ramp_dwelltime]
target        = "unity.kv.SequenceManager.dwell_target_seconds"
op            = "add"         # set|add|mul|substract
value         = 0.01
every         = "success:1"    # trial:N | success:N | episode:N | epoch:N
min           = 0.1
max           = 1
